name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      is_nightly:
        type: boolean
        required: false
        default: false
        description: 'Whether this is a nightly release'
      version:
        type: string
        required: false
        default: ''
        description: 'Release version for manually triggered release'
      ref:
        type: string
        required: false
        default: ''
        description: 'Git commit SHA or reference to build'

env:
  CACHIX_SUBSTITUTERS: https://cache.nixos.org https://attic.xuyh0120.win/lantian
  CACHIX_PUBLIC_KEYS: cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

jobs:
  setup-hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: set-hosts
        run: echo "hosts=$(bash .github/scripts/get-hosts.sh)" >> $GITHUB_OUTPUT

  build:
    needs: setup-hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.setup-hosts.outputs.hosts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm big-parallel nixos-test
            substituters = ${{ env.CACHIX_SUBSTITUTERS }}
            trusted-public-keys = ${{ env.CACHIX_PUBLIC_KEYS }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Build Disko Images
        run: |
          nix-build "${{ matrix.host }}" \
            --option substituters "${{ env.CACHIX_SUBSTITUTERS }}" \
            --option trusted-public-keys "${{ env.CACHIX_PUBLIC_KEYS }}" \
            -o result

      - name: Prepare and Compress Image
        id: prep
        run: |
          HOST_NAME=$(basename "${{ matrix.host }}")
          echo "host_name=${HOST_NAME}" >> $GITHUB_OUTPUT
          cp result/*.raw ${HOST_NAME}.raw
          tar -I "zstd -19 -T0" -cf ${HOST_NAME}.tar.zst ${HOST_NAME}.raw
          rm -f ${HOST_NAME}.raw

          FILE_SIZE=$(stat -c%s "${HOST_NAME}.tar.zst")
          MAX_SIZE=$((1900 * 1024 * 1024))
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "File ${HOST_NAME}.tar.zst size (${FILE_SIZE} bytes) exceeds limit (${MAX_SIZE} bytes). Splitting into 1900M parts..."
            split -b 1900M -d -a 2 "${HOST_NAME}.tar.zst" "${HOST_NAME}.tar.zst.part"
            rm -f "${HOST_NAME}.tar.zst"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: image-${{ steps.prep.outputs.host_name }}
          path: ${{ steps.prep.outputs.host_name }}.tar.zst*
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download Artifacts
        uses: actions/download-artifact@main
        with:
          pattern: image-*
          merge-multiple: true

      - name: Delete Existing Nightly Release
        if: inputs.is_nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git push origin :refs/tags/nightly || true

      - name: Determine Release Metadata
        id: rel_meta
        run: |
          TARGET_REF="${{ inputs.ref || github.sha }}"
          SHORT_SHA="${TARGET_REF:0:7}"

          if [ "${{ inputs.is_nightly }}" = "true" ]; then
            TAG_NAME="nightly"
            RELEASE_NAME="Nightly Release $(date +'%Y%m%d-%H%M%S') (${SHORT_SHA})"
            IS_PRERELEASE="true"
            TITLE="Nightly System Raw Images Build"
          elif [ "${{ github.ref_name }}" = "pre-release" ]; then
            TAG_NAME="pre-release-latest"
            RELEASE_NAME="Pre-Release $(date +'%Y%m%d-%H%M%S')-${SHORT_SHA}"
            IS_PRERELEASE="true"
            TITLE="System Raw Images Pre-Release"
          else
            VERSION="${{ inputs.version || github.ref_name }}"
            TAG_NAME="${VERSION}"
            RELEASE_NAME="Release ${VERSION} ($(date +'%Y%m%d'))"
            IS_PRERELEASE="false"
            TITLE="System Raw Images Release"
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Generate Release Body
        run: |
          echo "${{ steps.rel_meta.outputs.title }}" > release_body.md
          echo "" >> release_body.md
          echo "**Commit:** \`${{ inputs.ref || github.sha }}\`" >> release_body.md
          echo "**Date:** \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\`" >> release_body.md
          echo "" >> release_body.md
          echo "**Artifacts:**" >> release_body.md
          for f in *.tar.zst*; do
            if [ -f "$f" ]; then
              echo "- \`$f\`" >> release_body.md
            fi
          done

          if ls *.part* >/dev/null 2>&1; then
            echo "" >> release_body.md
            echo "> **Note:** Files with \`.part*\` extensions were split because they exceeded GitHub's 2GB file limit." >> release_body.md
            echo "> To restore the original file: \`cat <filename>.tar.zst.part* > <filename>.tar.zst\`" >> release_body.md
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel_meta.outputs.tag_name }}
          target_commitish: ${{ inputs.ref || github.sha }}
          name: ${{ steps.rel_meta.outputs.release_name }}
          body_path: release_body.md
          files: |
            *.tar.zst
            *.tar.zst.part*
          prerelease: ${{ steps.rel_meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
