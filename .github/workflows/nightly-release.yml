name: Nightly Release System Images

on:
  workflow_run:
    workflows: ["Build and Test NixOS Configuration"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_SUBSTITUTERS: https://cache.nixos.org https://attic.xuyh0120.win/lantian
  CACHIX_PUBLIC_KEYS: cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc=

jobs:
  setup-hosts:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.set-hosts.outputs.hosts }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: set-hosts
        run: echo "hosts=$(bash .github/scripts/get-hosts.sh)" >> $GITHUB_OUTPUT

  build:
    needs: setup-hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.setup-hosts.outputs.hosts) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = kvm big-parallel nixos-test
            substituters = ${{ env.CACHIX_SUBSTITUTERS }}
            trusted-public-keys = ${{ env.CACHIX_PUBLIC_KEYS }}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Build Disko Images
        run: |
          nix-build "${{ matrix.host }}" \
            --option substituters "${{ env.CACHIX_SUBSTITUTERS }}" \
            --option trusted-public-keys "${{ env.CACHIX_PUBLIC_KEYS }}" \
            -o result

      - name: Prepare and Compress Image
        id: prep
        run: |
          HOST_NAME=$(basename "${{ matrix.host }}")
          echo "host_name=${HOST_NAME}" >> $GITHUB_OUTPUT
          cp result/*.raw ${HOST_NAME}.raw
          tar -I "zstd -19 -T0" -cf ${HOST_NAME}.tar.zst ${HOST_NAME}.raw

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: image-${{ steps.prep.outputs.host_name }}
          path: ${{ steps.prep.outputs.host_name }}.tar.zst
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download Artifacts
        uses: actions/download-artifact@main
        with:
          pattern: image-*
          merge-multiple: true

      - name: Delete Existing Nightly Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          git push origin :refs/tags/nightly || true

      - name: Generate Release Body
        run: |
          echo "Nightly System Raw Images Build" > release_body.md
          echo "" >> release_body.md
          echo "**Commit:** \`${{ github.event.workflow_run.head_sha || github.sha }}\`" >> release_body.md
          echo "**Date:** \`$(date -u +'%Y-%m-%d %H:%M:%S UTC')\`" >> release_body.md
          echo "" >> release_body.md
          echo "**Artifacts:**" >> release_body.md
          for f in *.tar.zst; do
            echo "- \`$f\`" >> release_body.md
          done

      - name: Generate Release Name
        id: release_name
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          RELEASE_NAME="Nightly Release $(date +'%Y%m%d-%H%M%S') (${SHORT_SHA})"
          echo "name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: ${{ steps.release_name.outputs.name }}
          body_path: release_body.md
          files: "*.tar.zst"
          prerelease: true
          generate_release_notes: true
